<script>/* Shared offline data model, synchronization and time accounting. */
(function(root){'use strict';

 for(let [old,type] of [['projects','project'],['tags','tag']])for(let name of x[old]||[])if(typeof name==='string'&&!x.catalogs.some(c=>c.type===type&&c.name===name))x.catalogs.push({id:uid(),type,name,color:'#00b7e9',_dirty:true,_op:uid(),_rev:0});

let generation=0;const treeCache=new WeakMap();

function commitItem(){let name=$('edit-title').value.trim();if(!name){toast('请填写事项内容');return;}let old=editing?db.items.find(x=>x.id===editing):null,t=old||{id:C.uid(),createdAt:Date.now(),done:false,deleted:false,order:-Date.now(),_rev:0};let times={};for(let [input,key]of [['start','startAt'],['due','dueAt'],['remind','remindAt']])times[key]=old&&$(input).value===datetime(old[key])?old[key]||0:$(input).value?new Date($(input).value).getTime():0;
 if(times.startAt&&times.dueAt&&times.dueAt<times.startAt){toast('结束时间不能早于开始时间');return;}if(times.remindAt&&times.remindAt<Date.now()&&times.remindAt!==old?.remindAt){toast('新的提醒时间需要晚于现在');return;}let weight=Number($('weight').value),estimate=Number($('estimate').value);if(!Number.isFinite(weight)||weight<=0||!Number.isInteger(estimate)||estimate<0){toast('请检查权重和预估番茄数');return;}
 let oldRepeat=t.repeat;Object.assign(t,times,{title:name,notes:$('edit-notes').value,summary:$('edit-summary').value,quadrant:editQ,kind:$('edit-kind').value,project:$('edit-project').value.trim(),location:$('edit-location').value.trim(),tags:[...new Set($('edit-tags').value.split(/[,，]/).map(x=>x.trim()).filter(Boolean))],allDay:$('all-day').checked,repeat:$('repeat').value,repeatUntil:$('repeat-until').value,weight,estimate,subtasks:[...$('edit-subs').children].map(div=>{let inputs=div.querySelectorAll('input');return{id:div.dataset.id,done:inputs[0].checked,text:inputs[1].value.trim(),estimate:Math.max(0,Math.floor(Number(inputs[2].value)||0))};}).filter(s=>s.text)});if(oldRepeat!==t.repeat)t.repeatAnchor=t.dueAt;if(!old)db.items.push(t);ensureCatalog('project',t.project);ensureCatalog('location',t.location);t.tags.forEach(x=>ensureCatalog('tag',x));if(mark(t)){closePanel(true);toast('已保存');}}

function timerRead(){if(native&&Native.timerState){let x=JSON.parse(Native.timerState());return x.timer||null;}return JSON.parse(localStorage.getItem('qingxiao-timer')||'null');}

function timerCommand(action){let input={...pendingFocus,mode:clockMode,minutes:clockMinutes,deviceId:db.deviceId};try{
 if(native&&Native.timerAction){let result=JSON.parse(Native.timerAction(action,JSON.stringify(input)));if(result.error)throw Error(result.error);timer=result.timer||null;db=C.normalize(JSON.parse(Native.load()));}
 else {let t=timerRead();if(action==='start'){if(t)throw Error('已有进行中的计时');t=C.startTimer(input);}else if(!t)return;else if(action==='pause')C.pauseTimer(t);else if(action==='resume')C.resumeTimer(t);else if(action==='finish'){let s=C.finishTimer(t);if(s.durationMs>0&&!db.sessions.some(x=>x.id===s.id))db.sessions.push(s);t=null;save();}timerWrite(t);timer=t;}
 lastTimerId=timer?.id||'';save();render();scheduleSync();
 }catch(e){toast(e.message);}}

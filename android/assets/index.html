 if(native&&Native.timerAction){let result=JSON.parse(Native.timerAction(action,JSON.stringify(input)));if(result.error)throw Error(result.error);timer=result.timer||null;db=C.normalize(JSON.parse(Native.load()));}

 lastTimerId=timer?.id||'';save();render();scheduleSync();
 }catch(e){toast(e.message);}}
function startFocus(){if(!Number.isInteger(clockMinutes)||clockMinutes<1||clockMinutes>180){toast('时长须为1～180分钟');return;}if(!native&&'Notification'in window&&Notification.permission==='default')Notification.requestPermission();timerCommand('start');}

function pomodoroHtml(){let t=timer,p=t||pendingFocus;let s=C.stats(db.sessions,C.dayStart(Date.now()),C.nextDay(Date.now()));let recent=db.sessions.filter(x=>!x.deleted).sort((a,b)=>b.endAt-a.endAt).slice(0,12);return `<section class="timer-page"><div class="timer-mode">${[['focus','专注'],['break','休息']].map(([m,n])=>`<button class="${(t?.mode||clockMode)===m?'selected':''}" ${t?'disabled':''} onclick="clockMode='${m}';clockMinutes=Number(cfg('${m==='focus'?'focusMinutes':'breakMinutes'}',${m==='focus'?25:5}));render()">${n}</button>`).join('')}</div><div class="timer-task" onclick="${t?'':'pickFocus()'}"><strong>${esc(p?.title||((t?.mode||clockMode)==='break'?'休息一下':'选择事项 / 自由专注'))}</strong><small>${t?'本设备计时，暂停的时间不会计入专注':p?.subtaskId?'子任务 · 可用多个番茄完成':'可选择任务或子任务'}</small></div><div class="clock"><strong id="clock-text">25:00</strong><small id="clock-state">准备开始</small></div>${!t?`<div class="duration-pick">${(clockMode==='focus'?[25,45,50]:[Number(cfg('breakMinutes',5)),Number(cfg('longBreakMinutes',15))]).map(m=>`<button class="${m===clockMinutes?'selected':''}" onclick="clockMinutes=${m};render()">${m}分</button>`).join('')}<input aria-label="自定义分钟" type="number" min="1" max="180" value="${clockMinutes}" onchange="clockMinutes=Number(this.value);tickDisplay()"></div>`:''}<div class="timer-controls">${!t?'<button class="primary" onclick="startFocus()">开始'+(clockMode==='focus'?'专注':'休息')+'</button>':`<button class="secondary" onclick="timerCommand('${t.state==='running'?'pause':'resume'}')">${t.state==='running'?'暂停':'继续'}</button><button class="primary" onclick="stopFocus()">结束并记录</button>`}</div><p class="hint" style="text-align:center">今日 ${s.completed} 个完整番茄 · 专注 ${mins(s.focus)}${s.partial?' · '+s.partial+' 次提前结束':''}</p><p class="hint">${native?'手机熄屏后仍按到期时间提醒。':'网页计时以实际时间计算。关闭网页后，下次打开会补齐结束记录；关闭网页期间无法保证通知，请使用手机提醒。'}</p><div class="timer-history"><h3>最近记录 <button style="float:right;font-size:12px" onclick="go('timesheet')">查看时间表 ›</button></h3>${recent.map(sessio function tickDisplay(){let t=timer,remaining=t?(t.state==='running'?Math.max(0,t.endAt-Date.now()):t.remainingMs):clockMinutes*60000;let sec=Math.ceil(remaining/1000),str=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');if($('clock-text'))$('clock-text').textContent=str;if($('clock-state'))$('clock-state').textContent=t?(t.state==='paused'?'已暂停':t.mode==='break'?'休息中':'专注中'):'准备开始';$('timer-bar').hidden=!t;if(t)$('timer-bar').textContent=(t.mode==='break'?'休息':'🍅 专注')+'  '+str+'  ·  '+t.title+(t.state==='paused'?'（已暂停）':'');}
function tick(){try{let prior=timer;timer=timerRead();if(timer&&timer.state==='running'&&Date.now()>=timer.endAt&&!native){let session=C.finishTimer(timer);if(!db.sessions.some(x=>x.id===session.id))db.sessions.push(session);timer=null;timerWrite(null);save();if('Notification'in window&&Notification.permission==='granted')new Notification('轻效 Todo',{body:session.mode==='focus'?'本次专注已完成，休息一下吧。':'休息结束，可以开始下一个番茄。'});}
 if(prior&&!timer){if(native)db=C.normalize(JSON.parse(Native.load()));clockMode=prior.mode==='focus'?'break':'focus';let completed=C.stats(db.sessions,C.dayStart(Date.now()),C.nextDay(Date.now())).completed;clockMinutes=Number(cfg(clockMode==='focus'?'focusMinutes':completed>0&&completed%4===0?'longBreakMinutes':'breakMinutes',clockMode==='focus'?25:5));pendingFocus={taskId:prior.taskId,subtaskId:prior.subtaskId,title:prior.title,project:prior.project};toast(prior.mode==='focus'?'本次专注结束，已保存时间记录':'休息结束');render();scheduleSync();}tickDisplay();}catch(e){console.warn('timer state unavailable');}}

function timesheetHtml(){let start=C.dayStart(date),end=C.nextDay(start,days),st=C.stats(db.sessions,start,end);let live=db.sessions.filter(s=>!s.deleted);let cols=[];for(let i=0;i<days;i++){let day=C.nextDay(start,i),stop=C.nextDay(day);let pieces=[];for(let s of live)for(let p of C.slices(s,day,stop))pieces.push({s,p});pieces.sort((a,b)=>a.p.startAt-b.p.startAt);let group=[],groupEnd=0;function finishGroup(){let lanes=[];for(let x of group){let lane=lanes.findIndex(end=>end<=x.p.startAt);if(lane<0)lane=lanes.length;lanes[lane]=x.p.endAt;x.lane=lane;}for(let x of group)x.width=Math.max(1,lanes.length);group=[];}for(let x of pieces){if(group.length&&x.p.startAt>=groupEnd)finishGroup();group.push(x);groupEnd=Math.max(groupEnd,x.p.endAt);}finishGroup();cols.push({day,pieces});}
 let grid=`<div class="time-corner">时间</div>`+cols.map(c=>`<div class="time-head ${C.dateKey(c.day)===C.dateKey(Date.now())?'today':''}">${new Date(c.day).toLocaleDateString('zh-CN',{month:'numeric',day:'numeric',weekday:'short'})}</div>`).join('')+`<div class="time-axis">${Array.from({length:24},(_,i)=>`<span style="top:${i*60+5}px">${String(i).padStart(2,'0')}:00</span>`).join('')}</div>`+cols.map(c=>`<div class="time-column">${c.pieces.map(({s,p,lane,width})=>{let top=(p.startAt-c.day)/60000,height=(p.endAt-p.startAt)/60000;return `<button class="time-block ${s.mode} ${s.status==='partial'?'partial':''}" style="top:${top}px;height:${Math.max(3,height)}px;left:calc(${lane/width*100}% + 2px);width:calc(${100/width}% - 4px)" title="${esc(s.title+' '+hm(p.startAt)+'—'+hm(p.endAt))}" onclick="sessionDetail(${arg(s.id)})">${height>=12?esc(s.title):''}${height>=24?'<span>'+hm(p.startAt)+'—'+hm(p.endAt)+'</span>':''}</button>`;}).join('')}${C.dateKey(c.day)===C.dateKey(Date.now())?`<div class="now-line" style="top:${(Date.now()-c.day)/60000}px"></div>`:''}</div>`).join('');
 return `<section class="time-page"><div class="toolbar"><button onclick="moveDate(-days)">‹</button><input type="date" aria-label="时间表日期" value="${C.dateKey(date)}" onchange="date=new Date(this.value+'T00:00:00').getTime();render()"><button onclick="moveDate(days)">›</button><button class="${days===1?'selected':''}" onclick="days=1;render()">日</button><button class="${days===7?'selected':''}" onclick="days=7;render()">周</button><button onclick="manualSession()">＋ 补记</button></div><div class="stats-row"><div><strong>${st.completed}</strong><small>完整番茄</small></div><div><strong>${Math.round(st.focus/60000)}</strong><small>专注分钟</small></div><div><strong>${Math.round(st.recorded/60000)}</strong><small>已记录分钟</small></div></div><div class="legend"><span><i></i>专注</span><span><i style="background:#cce7cc"></i>休息</span><span><i style="background:#c9e5f4"></i>补记</span><button style="font-size:11px;min-height:20px;padding:0;margin-left:auto" onclick="timeSummary()">时间分配 ›</button></div><div id="sheet-scroll" class="sheet-scroll"><div class="time-grid" style="--days:${days}">${grid}</div></div><p class="stats-note">每条横线为30分钟；暂停留白。重叠时间按并集统计，不重复累加。${st.partial?'提前结束 '+st.partial+' 次。':''}</p></section>`;}
function manualSession(){let end=new Date(),start=new Date(+end-25*60000);show('补记时间',`<label>做了什么</label><input id="manual-title" placeholder="例如：整理资料、运动" style="width:100%"><label>类型</label><select id="manual-mode" style="width:100%"><option value="manual">日常活动</option><option value="focus">专注（补记，不计完整番茄）</option><option value="break">休息</option></select><label>关联任务 / 子任务</label><select id="manual-task" style="width:100%"><option value="">不关联</option>${db.items.filter(t=>!t.deleted).map(t=>`<option value="${esc(t.id)}">${esc(t.title)}</option>${t.subtasks.map(s=>`<option value="${esc(t.id+'|'+s.id)}">↳ ${esc(s.text)}</option>`).join('')}`).join('')}</select><label>开始</label><input id="manual-start" type="datetime-local" value="${datetime(+start)}" style="width:100%"><label>结束</label><input id="manual-end" type="datetime-local" value="${datetime(+end)}" style="width:100%"><label>分类</label><input id="manual-category" placeholder="工作、学习、运动、生活…" style="width:100%">`,`<button class="primary" onclick="commitManual()">保存时间记录</button>`);}
function commitManual(){let title=$('manual-title').value.trim(),startAt=new Date($('manual-start').value).getTime(),endAt=new Date($('manual-end').value).getTime();if(!title||!Number.isFinite(startAt)||!Number.isFinite(endAt)||endAt<=startAt||endAt>Date.now()+60000||endAt-startAt>7*86400000){toast('请填写内容和正确的起止时间，结束时间不能在未来');return;}let [taskId='',subtaskId='']=$('manual-task').value.split('|'),t=db.items.find(t=>t.id===taskId),s={id:C.uid(),title,mode:$('manual-mode').value,status:'manual',taskId,subtaskId,project:t?.project||'',category:$('manual-category').value.trim()||'日常',startAt,endAt,segments:[{startAt,endAt}],durationMs:endAt-startAt,plannedMs:0,deviceId:db.deviceId,deleted:false};db.sessions.push(s);if(mark(s)){closePanel(true);toast('时间已补记');}}
function timeSummary(){let start=C.dayStart(date),end=C.nextDay(start,days),total=C.stats(db.sessions,start,end),groups={};for(let s of db.sessions.filter(s=>!s.deleted)){let name=s.project||s.category||(s.mode==='break'?'休息':'未分类');(groups[name]??=[]).push(...C.slices(s,start,end));}show('时间分配',`<p class="hint">${C.dateKey(start)}${days>1?' — '+C.dateKey(C.nextDay(end,-1)):''}</p><div class="stats-row"><div><strong>${mins(total.focus)}</strong><small>专注</small></div><div><strong>${mins(total.break)}</strong><small>休息</small></div><div><strong>${mins(Math.max(0,end-start-total.recorded))}</strong><small>未记录</small></div></div>${Object.entries(groups).sort((a,b)=>C.unionDuration(b[1])-C.unionDuration(a[1])).map(([name,p])=>`<div class="breakdown-row">${esc(name)}<span>${mins(C.unionDuration(p))}</span><div class="progress-line"><i style="width:${Math.min(100,C.unionDuration(p)/(total.recorded||1)*100)}%"></i></div></div>`).join('')}<p class="hint">这里只统计你记录的时间，不自动判断空白时段在做什么。分类之间有重叠时，各分类占比可能相加超过100%。</p>`,`<button class="primary" onclick="exportCSV()">导出时间明细 CSV</button>`);}
function achievementHtml(){let start=C.dayStart(date),end=C.nextDay(start),done=db.items.filter(t=>!t.deleted&&t.done&&t.completedAt>=start&&t.completedAt<end),todo=db.items.filter(t=>!t.deleted&&!t.done&&t.dueAt>=start&&t.dueAt<end),completedWeight=done.reduce((a,b)=>a+Number(b.weight||1),0),allWeight=completedWeight+todo.reduce((a,b)=>a+Number(b.weight||1),0),stars=allWeight?Math.round(5*completedWeight/allWeight):0,ps=C.stats(db.sessions,start,end);return `<div class="date-filter"><button onclick="moveDate(-1)">‹ 前一天</button><input type="date" value="${C.dateKey(date)}" onchange="date=new Date(this.value+'T00:00:00').getTime();render()"><button onclick="moveDate(1)">后一天 ›</button></div><div class="stats-row"><div><strong>${done.length}</strong><small>当天完成</small></div><div><strong>${todo.length}</strong><small>当天未完成</small></div><div><strong>${ps.completed}</strong><small>完整番茄</small></div></div><div class="day-summary"><p style="color:#edbf45;font-size:35px;letter-spacing:6px">${'★'.repeat(stars)+'☆'.repeat(5-stars)}</p><p class="hint">星级按当天完成权重 ÷（当天完成权重＋当天到期未完成权重）×5计算。没有记录时不评星；</p><h3 style="font-size:16px">当天完成</h3>${done.map(itemRow).join('')||'<p class="hint">还没有完成记录。</p>'}<button class="secondary" onclick="go('timesheet')">查看番茄时间表</button></div>`;}
function settings(){drawer(false);let status=syncError?'最近同步失败：'+lastSyncError:native&&Native.syncStatus?Native.syncStatus():lastSync?'已连接个人空间':'等待同步';show('设置',`<div class="settings-row"><strong>轻效 Todo · 2.1</strong><small>个人待办、番茄钟与跨设备时间表</small></div><div class="settings-row"><button onclick="syncNow(true)">☁ 立即同步</button><small>${esc(status)} · 待同步 ${C.changes(db).length} 项</small></div><div class="settings-row"><button onclick="exportData()">导出完整备份</button><small>包含任务、子任务、番茄时间与分类；不含登录凭据。</small></div><div class="settings-row"><button onclick="importFile()">从备份导入</button><small>按编号合并，保留现有记录。</small></div><div class="settings-row"><button onclick="closePanel();go('trash')">回收站</button></div><label>默认专注分钟</label><input id="pref-focus" type="number" min="1" max="180" value="${Number(cfg('focusMinutes',25))}"><label>短休息分钟</label><input id="pref-break" type="number" min="1" max="180" value="${Number(cfg('breakMinutes',5))}"><label>长休息分钟（每4个番茄可选）</label><input id="pref-long-break" type="number" min="1" max="180" value="${Number(cfg('longBreakMinutes',15))}"><label>每日计划提醒（手机通知）</label><input id="pref-plan" type="time" value="${esc(cfg('planReminder',''))}"><button onclick="$('pref-plan').value=''">关闭</button><label>每日回顾提醒（手机通知）</label><input id="pref-review" type="time" value="${esc(cfg('reviewReminder',''))}"><button onclick="$('pref-review').value=''">关闭</button>${native?`<div class="settings-row"><button onclick="Native.appLockSettings()">应用密码保护</button><small>${esc(Native.lockStatus())}</small></div><div class="settings-row"><button onclick="Native.permissions()">通知与精确提醒权限</button><small>${esc(Native.reminderStatus())}</small></div><div class="settings-row"><button onclick="Native.loadEncryptedConfig();toast(Native.syncStatus());syncNow()">重新读取设备同步配置</button></div>`:'<div class="settings-row"><a href="/signout-with-chatgpt?return_to=/" target="_top">退出网页登录</a></div>'}<p class="hint">手机与电脑通过你的私有空间同步。离线修改会保留在本机，连接后补传。手机与网页打开时约15秒同步一次；手机后台同步受系统调度影响。云空间需要网络可访问当前网站。同项同时 commitItem=function(){if(photoBusy){toast('照片正在保存，请稍等');return;}try{let name=$('edit-title').value.trim();if(!name)throw Error('请填写事项内容');let old=editing?db.items.find(x=>x.id===editing):null,t=C.clone(old||{id:C.uid(),createdAt:Date.now(),done:false,deleted:false,order:-Date.now(),_rev:0});let times=readSchedule(null,old),weight=Number($('weight').value),estimate=Number($('estimate').value);if(!Number.isFinite(weight)||weight<=0||!Number.isInteger(estimate)||estimate<0||estimate>1000)throw Error('请检查权重和预估番茄数');let subtasks=[...$('edit-subs').children].map(div=>{let prev=old?.subtasks.find(x=>x.id===div.dataset.id)||{},estimate=Number(div.querySelector('[data-sub=estimate]').value);if(!Number.isInteger(estimate)||estimate<0||estimate>1000)throw Error('子任务预估番茄须为0～1000的整数');return {...prev,id:div.dataset.id,text:div.querySelector('[data-sub=text]').value.trim(),done:div.querySelector('[data-sub=done]').checked,estimate,...readSchedule(div,prev,true)};}).filter(s=>s.text);let repeat=$('repeat').value;if(repeat!=='none'&&!times.dueAt)throw Error('重复事项需要设置截止时间');Object.assign(t,times,{title:name,notes:$('edit-notes').value,summary:$('edit-summary').value,quadrant:editQ,kind:$('edit-kind').value,project:$('edit-project').value.trim(),location:$('edit-location').value.trim(),tags:[...new Set($('edit-tags').value.split(/[,，]/).map(x=>x.trim()).filter(Boolean))],allDay:$('all-day').checked,repeat,repeatUntil:$('repeat-until').value,weight,estimate,subtasks,photos:C.clone(editingPhotos)});if(old?.repeat!==repeat)t.repeatAnchor=t.dueAt;C.validate({...db,items:[t]});if(old){if(editingSnapshot&&old._rev!==editingSnapshot._rev)t._rev=editingSnapshot._rev;Object.assign(old,t);}else db.items.push(t);ensureCatalog('project',t.project);ensureCatalog('location',t.location);t.tags.forEach(x=>ensureCatalog('tag',x));if(mark(old||t)){closePanel(true);toast('事项已保存');}}catch(e){toast(e.message);}};
const originalOpenItem=openItem;openItem=function(id,sid=''){originalOpenItem(id);let t=db.items.find(x=>x.id===id);if(!t)return;const body=$('panel').querySelector('.panel-body');if(t.photos?.length){let box=document.createElement('section');box.innerHTML='<label>照片</label>'+photoGallery(t.photos);body.insertBefore(box,body.querySelector('.detail-meta'));hydratePhotos();}if(t.startAt||t.dueAt){let b=document.createElement('button');b.className='secondary';b.textContent='添加到系统日历';b.onclick=()=>addToCalendar(id);body.append(b);}body.querySelectorAll('.sub-detail').forEach((row,index)=>{let sub=t.subtasks[index];row.dataset.subtaskId=sub.id;let button=document.createElement('button');button.className='sub-schedule-button';button.textContent='日程';button.onclick=()=>editSubSchedule(id,sub.id);row.append(button);if(sub.startAt||sub.dueAt||sub.remindAt){let info=document.createElement('small');info.textContent=(sub.startAt?'开始 '+longDate(sub.startAt):sub.dueAt?'截止 '+longDate(sub.dueAt):'')+(sub.remindAt?' · ⏰ '+longDate(sub.remindAt):'');row.querySelector('div').append(info);}if(sub.id===sid){row.classList.add('highlight');requestAnimationFrame(()=>row.scrollIntoView({block:'center'}));}});};
function editSubSchedule(id,sid){let t=db.items.find(x=>x.id===id),s=t.subtasks.find(x=>x.id===sid);show('子任务日程',`<div class="detail-title">${esc(s.text)}</div><p class="hint">所属事项：${esc(t.title)}</p><label>开始</label><input id="start" type="datetime-local" value="${datetime(s.startAt)}"><label>结束 / 截止</label><input id="due" type="datetime-local" value="${datetime(s.dueAt)}"><label>提醒</label><input id="remind" type="datetime-local" value="${datetime(s.remindAt)}"><div class="row"><select aria-label="快捷提醒" onchange="offsetReminder(this.value)"><option value="">快捷提醒</option><option value="0">开始时</option><option value="5">提前5分钟</option><option value="15">提前15分钟</option></select><button onclick="$('remind').value='';dirty=true">关闭提醒</button></div><label>提醒方式</label><select id="reminder-style">${reminderOptions(s.reminderStyle)}</select><p class="hint">保存后显示在应用日历中，手机会按提醒时间通知。</p>${s.startAt||s.dueAt?`<button class="secondary" onclick="addToCalendar(${arg(id)},${arg(sid)})">添加到系统日历（已保存的时间）</button>`:''}`,`<button class="secondary" onclick="clearSubSchedule(${arg(id)},${arg(sid)})">取消日程</button><button class="primary" onclick="saveSubSchedule(${arg(id)},${arg(sid)})">保存</button>`);$('panel').oninput=()=>dirty=true;$('panel').onchange=()=>dirty=true;}

function calendarHtml(){let day=C.dayStart(date),first=new Date(day);first.setDate(1);let gridStart=new Date(first);gridStart.setDate(1-((first.getDay()+6)%7));let month=first.getMonth(),all=C.agenda(db,+gridStart,C.nextDay(+gridStart,42)),events=C.agenda(db,day,C.nextDay(day)).filter(r=>calendarShowDone||!r.done);return `<section class="calendar-page"><div class="toolbar"><button onclick="changeMonth(-1)">‹ 上月</button><strong>${first.getFullYear()}年${month+1}月</strong><button onclick="changeMonth(1)">下月 ›</button><button onclick="date=C.dayStart(Date.now());render()">今天</button></div><div class="calendar-grid"><div class="calendar-week">${['一','二','三','四','五','六','日'].map(d=>'<span>'+d+'</span>').join('')}</div><div class="calendar-days">${Array.from({length:42},(_,i)=>{let a=C.nextDay(+gridStart,i),b=C.nextDay(a),n=new Date(a),count=all.filter(e=>(calendarShowDone||!e.done)&&e.startAt<b&&e.endAt>a).length;return `<button class="${n.getMonth()!==month?'outside':''} ${a===day?'selected':''} ${a===C.dayStart(Date.now())?'today':''}" onclick="date=${a};render()" aria-label="${C.dateKey(a)}，${count}个日程"><span>${n.getDate()}</span><small>${count?'● '+count:'&nbsp;'}</small></button>`;}).join('')}</div></div><div class="agenda-head"><strong>${new Date(day).toLocaleDateString('zh-CN',{month:'numeric',day:'numeric',weekday:'long'})}</strong><label><input type="checkbox" ${calendarShowDone?'checked':''} onchange="calendarShowDone=this.checked;render()"> 显示已完成</label><button onclick="newScheduledItem()">＋ 日程</button></div><div class="agenda-list">${events.map(e=>`<button class="agenda-row ${e.done?'done':''}" style="--q:var(--q${e.quadrant})" onclick="${e.subtaskId?'editSubSchedule('+arg(e.taskId)+','+arg(e.subtaskId)+')':'openItem('+arg(e.taskId)+')'}"><span>${hm(e.startAt)}<small>${hm(e.endAt)}</small></span><div><strong>${esc(e.title)}</strong><small>${e.subtaskId?'子任务 · '+esc(e.parentTitle):'事项'}${e.remindAt?' · ⏰ '+longDate(e.remindAt):''}</small></div><span>›</span></b function addToCalendar(id,sid=''){let t=db.items.find(x=>x.id===id),s=sid?t.subtasks.find(x=>x.id===sid):t;let start=s.startAt||s.dueAt,end=Math.max(s.dueAt||start+1800000,start+60000);if(!start){toast('请先设置日程时间');return;}const event={id:id+(sid?'-'+sid:''),title:sid?s.text:t.title,description:sid?'所属事项：'+t.title:t.notes||'',startAt:start,endAt:end,allDay:!!s.allDay,remindAt:s.remindAt||0,location:t.location||''};if(native){Native.addCalendarEvent(JSON.stringify(event));return;}let escape=x=>String(x).replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/;/g,'\\;').replace(/,/g,'\\,'),stamp=x=>new Date(x).toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');let lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Qingxiao//Todo//ZH','BEGIN:VEVENT','UID:'+escape(event.id)+'@qingxiao','DTSTAMP:'+stamp(Date.now()),'DTSTART:'+stamp(start),'DTEND:'+stamp(end),'SUMMARY:'+escape(event.title),'DESCRIPTION:'+escape(event.description),'LOCATION:'+escape(event.location)];if(event.remindAt)lines.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:提醒','TRIGGER;VALUE=DATE-TIME:'+stamp(event.remindAt),'END:VALARM');lines.push('END:VEVENT','END:VCALENDAR');downloadCalendar(new Blob([lines.join('\r\n')+'\r\n'],{type:'text/calendar;charset=utf-8'}),'轻效Todo-日程.ics');toast('已导出日程文件，打开后可加入电脑日历');}

const originalTimesheet=timesheetHtml;timesheetHtml=function(){let html=originalTimesheet();html=html.replace('<div class="time-grid" style="--days:',`<div class="time-grid" style="--zoom:${sheetZoom};--days:`);html=html.replace(/top:([\d.]+)px/g,(_,v)=>'top:'+(Number(v)*sheetZoom)+'px').replace(/height:([\d.]+)px/g,(_,v)=>'height:'+(Number(v)*sheetZoom)+'px');html=html.replace(/<div class="time-column">/g,()=>'<div class="time-column" ondblclick="addTimeAt(event)" onclick="timeGridTap(event)">');html=html.replace('＋ 补记</button>','＋ 补记</button><select aria-label="时间表缩放" onchange="sheetZoom=Number(this.value);render()">'+[[1,'紧凑'],[1.5,'标准'],[2,'放大']].map(([v,t])=>`<option value="${v}" ${v===sheetZoom?'selected':''}>${t}</option>`).join('')+'</select>');html=html.replace('每条横线为30分钟；暂停留白。','点击空白补记；点击色块查看或修改。每条横线30分钟，暂停留白。');return html;};

function saveSessionEdit(id){let s=db.sessions.find(x=>x.id===id),title=$('session-title').value.trim();if(!title){toast('请填写内容');return;}let changed=false,segments=[...$('session-segments').children].map((div,i)=>{let inputs=div.querySelectorAll('input'),old=s.segments[i],a=inputs[0].value,b=inputs[1].value;if(a===datetime(old.startAt)&&b===datetime(old.endAt))return {...old};changed=true;return {startAt:new Date(a).getTime(),endAt:new Date(b).getTime()};});if(segments.some((p,i)=>!Number.isFinite(p.startAt)||!Number.isFinite(p.endAt)||p.endAt<=p.startAt||p.endAt>Date.now()+60000||(i>0&&p.startAt<segments[i-1].endAt))){toast('请检查起止时间、顺序和重叠');return;}let [taskId='',subtaskId='']=$('session-task').value.split('|');Object.assign(s,{title,category:$('session-category').value.trim(),taskId,subtaskId,project:db.items.find(t=>t.id===taskId)?.project||'',segments,startAt:segments[0].startAt,endAt:segments.at(-1).endAt,durationMs:C.unionDuration(segments)});if(changed)s.status='manual';if(mark(s)){closePanel(true);sessionDetail(id);}}
